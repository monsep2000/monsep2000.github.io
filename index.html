<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardiam Lock Seal Design</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        
        .seal-container {
            width: 800px; /* Increased from 600px */
            height: 400px; /* Increased from 280px */
            position: relative;
            margin-bottom: 30px;
        }
        
        .seal {
            width: 100%;
            height: 100%;
            border: 12px solid #003366; /* Thicker border */
            position: relative;
            display: flex;
            background-color: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
            padding: 35px; /* Increased padding */
            box-sizing: border-box;
        }
        
        .seal-inner {
            width: 100%;
            height: 100%;
            border: 4px dashed #003366; /* Thicker dash */
            display: flex;
            position: relative;
        }
        
        .logo-info-container {
            display: flex;
            width: 100%;
            align-items: center;
            padding: 30px; /* Increased padding */
        }
        
        .logo-img {
            width: 237px; /* Increased by 60% from 148px */
            height: 237px; /* Increased by 60% from 148px */
            object-fit: contain;
            margin-right: 50px; /* Increased margin */
        }
        
        .info-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .registration-number {
            font-weight: bold;
            font-size: 34px; /* Increased from 24px */
            color: #003366;
            margin-bottom: 18px; /* Increased margin */
        }
        
        .company-name {
            font-weight: bold;
            font-size: 42px; /* Increased from 30px */
            color: #003366;
            line-height: 1.2;
        }
        
        .corner {
            position: absolute;
            width: 70px; /* Larger corners */
            height: 70px; /* Larger corners */
            border-color: #003366;
            border-style: solid;
        }
        
        .top-left {
            top: 0;
            left: 0;
            border-width: 12px 0 0 12px;
        }
        
        .top-right {
            top: 0;
            right: 0;
            border-width: 12px 12px 0 0;
        }
        
        .bottom-left {
            bottom: 0;
            left: 0;
            border-width: 0 0 12px 12px;
        }
        
        .bottom-right {
            bottom: 0;
            right: 0;
            border-width: 0 12px 12px 0;
        }
        
        .export-btn {
            background-color: #003366;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 30px;
        }
        
        .export-btn:hover {
            background-color: #002244;
        }
    </style>
</head>
<body>
    <div class="seal-container" id="seal-to-export">
        <div class="seal">
            <div class="seal-inner">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
                
                <div class="logo-info-container">
                    <!-- Replace this with your actual logo -->
                    <img src="your-logo.png" alt="Guardiam Lock Logo" class="logo-img">
                    
                    <div class="info-text">
                        <div class="registration-number">GL0180809SBA</div>
                        <div class="company-name">GUARDIAM LOCK S.A de C.V.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <button class="export-btn" id="export-pdf">Export to PDF</button>

    <script>
        document.getElementById('export-pdf').addEventListener('click', function() {
            const element = document.getElementById('seal-to-export');
            const opt = {
                margin: 15,
                filename: 'Guardiam_Lock_Seal.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { 
                    scale: 3, /* Higher scale for better quality */
                    logging: false,
                    useCORS: true
                },
                jsPDF: { 
                    unit: 'mm', 
                    format: 'a4', 
                    orientation: 'portrait' 
                }
            };
            
            // Show loading feedback
            const btn = this;
            btn.textContent = 'Generating PDF...';
            btn.disabled = true;
            
            // Generate PDF
            html2pdf().from(element).set(opt).save().then(() => {
                btn.textContent = 'Export to PDF';
                btn.disabled = false;
            }).catch(err => {
                console.error('PDF generation error:', err);
                btn.textContent = 'Error - Try Again';
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
